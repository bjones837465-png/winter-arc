<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WINTER ARC</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b12;
  --bg2:#0c1220;
  --card:#101928;
  --card2:#0c1420;
  --border:#1c2a3d;
  --border-soft:#152131;
  --ice:#6fd6ff;
  --ice2:#a9ecff;
  --ice-dim:#254057;
  --frost:#eef6fc;
  --frost-dim:#8ea0b5;
  --frost-faint:#54677c;
  --mint:#5fe3ac;
  --danger:#ff6b6b;
  --amber:#ffc266;
  --radius:14px;
  --radius-sm:9px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #0e1a2b 0%, var(--bg) 55%),
    var(--bg);
  color:var(--frost);
  font-family:'Inter',sans-serif;
  overscroll-behavior:none;
  min-height:100vh;
  display:flex;
  justify-content:center;
}
#app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  isolation:isolate;
}
#snow{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55;}

/* ---------- Header ---------- */
header.topbar{
  position:relative; z-index:2;
  padding:18px 18px 10px;
  display:flex; flex-direction:column; gap:2px;
}
.brand{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:22px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--frost);
  display:flex;
  align-items:baseline;
  gap:8px;
}
.brand .dot{color:var(--ice); text-shadow:0 0 12px rgba(111,214,255,.7);}
.brand-sub{
  font-size:10.5px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--frost-faint);
  font-family:'JetBrains Mono',monospace;
}
.datebar{
  margin-top:12px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg, var(--card), var(--card2));
  border:1px solid var(--border);
  border-radius:12px;
  padding:8px 6px;
}
.datebar button{
  background:none; border:none; color:var(--ice); font-size:18px;
  width:38px; height:34px; border-radius:8px; cursor:pointer;
  font-family:'JetBrains Mono',monospace;
}
.datebar button:active{background:var(--ice-dim);}
.datebar .datelabel{
  font-family:'Oswald',sans-serif;
  font-weight:500;
  letter-spacing:1.5px;
  text-transform:uppercase;
  font-size:13.5px;
  color:var(--frost);
  text-align:center;
  flex:1;
}
.datebar .today-pill{
  font-size:9.5px; color:var(--ice); font-family:'JetBrains Mono',monospace;
  display:block; margin-top:1px; letter-spacing:1px;
}

/* ---------- Main content ---------- */
main#view{
  position:relative; z-index:1;
  flex:1;
  padding:14px 16px 100px;
  overflow-y:auto;
}
.section-title{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:13px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--frost-dim);
  margin:22px 2px 10px;
  display:flex; align-items:center; justify-content:space-between;
}
.section-title:first-child{margin-top:4px;}
.section-title .manage-link{
  font-family:'Inter',sans-serif; font-weight:600; font-size:11.5px;
  letter-spacing:.3px; text-transform:none; color:var(--ice); cursor:pointer;
}

.card{
  background:linear-gradient(165deg, var(--card), var(--card2));
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute; top:-40%; right:-20%;
  width:140px; height:140px;
  background:radial-gradient(circle, rgba(111,214,255,.10), transparent 70%);
  pointer-events:none;
}
.card-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.card-title{font-weight:600; font-size:14.5px; color:var(--frost);}
.card-sub{font-size:12px; color:var(--frost-dim); margin-top:2px;}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

/* stat tile */
.stat{
  background:linear-gradient(165deg, var(--card), var(--card2));
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:13px;
}
.stat .num{
  font-family:'Oswald',sans-serif; font-size:26px; font-weight:600; color:var(--ice2);
  text-shadow:0 0 14px rgba(111,214,255,.25);
  line-height:1.1;
}
.stat .lbl{font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--frost-faint); margin-top:4px;}

/* buttons */
.btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
  border-radius:10px; border:1px solid var(--border);
  background:var(--card2); color:var(--frost);
  padding:10px 14px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(135deg, var(--ice), #4bb3e0);
  color:#04141f; border:none; font-weight:700;
  box-shadow:0 4px 18px rgba(111,214,255,.25);
}
.btn-ghost{background:transparent; border:1px dashed var(--border);}
.btn-danger{background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.35); color:var(--danger);}
.btn-block{width:100%;}
.btn-sm{padding:7px 10px; font-size:12px; border-radius:8px;}
.icon-btn{
  background:var(--card2); border:1px solid var(--border); color:var(--frost-dim);
  width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:15px;
}
.icon-btn:active{transform:scale(.94);}

/* list items */
.list-item{
  display:flex; align-items:center; gap:10px;
  padding:11px 4px; border-bottom:1px solid var(--border-soft);
}
.list-item:last-child{border-bottom:none;}
.check{
  width:24px; height:24px; border-radius:7px; border:1.5px solid var(--frost-faint);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  font-size:14px; color:transparent;
}
.check.on{background:linear-gradient(135deg,var(--ice),#4bb3e0); border-color:transparent; color:#04141f;}
.li-text{flex:1; font-size:14px; color:var(--frost);}
.li-text.done{color:var(--frost-faint); text-decoration:line-through;}
.li-sub{font-size:11px; color:var(--frost-faint); margin-top:1px;}
.li-del{color:var(--frost-faint); cursor:pointer; font-size:16px; padding:4px 6px;}

.empty-state{
  text-align:center; padding:30px 12px; color:var(--frost-faint); font-size:13px;
  border:1px dashed var(--border); border-radius:var(--radius);
}
.empty-state .big{font-size:26px; display:block; margin-bottom:6px;}

/* forms */
.field{margin-bottom:12px;}
.field label{
  display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase;
  color:var(--frost-faint); margin-bottom:6px; font-family:'JetBrains Mono',monospace;
}
.field input[type=text], .field input[type=number], .field input[type=time], .field textarea, .field select{
  width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:9px;
  padding:11px 12px; color:var(--frost); font-size:14.5px; font-family:'Inter',sans-serif;
}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  padding:8px 13px; border-radius:20px; border:1px solid var(--border); background:var(--card2);
  font-size:12.5px; color:var(--frost-dim); cursor:pointer;
}
.chip.on{background:rgba(111,214,255,.14); border-color:var(--ice); color:var(--ice2);}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(3,7,13,.72); backdrop-filter:blur(3px);
  z-index:50; display:flex; align-items:flex-end; justify-content:center;
}
.modal-overlay.center{align-items:center; padding:20px;}
.modal{
  width:100%; max-width:520px; background:linear-gradient(180deg, #101a2a, #0a1220);
  border:1px solid var(--border); border-bottom:none;
  border-radius:20px 20px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
  max-height:88vh; overflow-y:auto;
  animation:slideup .18s ease-out;
}
.modal-overlay.center .modal{border-radius:18px; border-bottom:1px solid var(--border); animation:popin .15s ease-out;}
@keyframes slideup{from{transform:translateY(24px); opacity:.4;} to{transform:translateY(0); opacity:1;}}
@keyframes popin{from{transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;}}
.modal-handle{width:38px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 14px;}
.modal-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; letter-spacing:1px; text-transform:uppercase; margin-bottom:14px;}
.modal-close{position:absolute; top:14px; right:16px; color:var(--frost-faint); font-size:20px; cursor:pointer;}

/* progress ring */
.ring-wrap{position:relative; width:96px; height:96px; flex:none;}
.ring-num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-num .n{font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; color:var(--ice2);}
.ring-num .l{font-size:8.5px; letter-spacing:1px; text-transform:uppercase; color:var(--frost-faint); margin-top:1px;}

/* macro bars */
.macro{margin-bottom:9px;}
.macro-top{display:flex; justify-content:space-between; font-size:11.5px; color:var(--frost-dim); margin-bottom:4px;}
.macro-track{height:6px; border-radius:4px; background:var(--bg2); overflow:hidden;}
.macro-fill{height:100%; border-radius:4px;}

/* water glasses */
.glass-row{display:flex; flex-wrap:wrap; gap:9px; margin:12px 0 4px;}
.glass{
  width:34px; height:42px; border-radius:4px 4px 8px 8px; border:2px solid var(--ice-dim);
  background:var(--bg2); cursor:pointer; position:relative; flex:none;
}
.glass.filled{background:linear-gradient(180deg, transparent 8%, rgba(111,214,255,.55) 8%); border-color:var(--ice);}

/* nav */
nav.bottomnav{
  position:fixed; z-index:5; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:520px;
  background:linear-gradient(180deg, rgba(10,16,26,.85), rgba(6,10,18,.98));
  border-top:1px solid var(--border);
  backdrop-filter:blur(10px);
  display:flex; padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 6px);
}
.navbtn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--frost-faint); padding:6px 0; cursor:pointer;
}
.navbtn .ic{font-size:19px;}
.navbtn .lb{font-size:9.5px; letter-spacing:.5px; text-transform:uppercase; font-family:'JetBrains Mono',monospace;}
.navbtn.active{color:var(--ice);}
.navbtn.active .ic{filter:drop-shadow(0 0 6px rgba(111,214,255,.7));}

/* misc */
.streak-flame{color:var(--ice2); text-shadow:0 0 10px rgba(111,214,255,.6);}
.tag{display:inline-block; font-size:10px; padding:3px 8px; border-radius:20px; background:var(--ice-dim); color:var(--ice2); letter-spacing:.5px;}
.tag.danger{background:rgba(255,107,107,.15); color:var(--danger);}
.tag.mint{background:rgba(95,227,172,.15); color:var(--mint);}
.divider{height:1px; background:var(--border-soft); margin:14px 0;}
.hint{font-size:11.5px; color:var(--frost-faint); line-height:1.5;}
.spinner{
  width:26px; height:26px; border-radius:50%; border:3px solid var(--ice-dim); border-top-color:var(--ice);
  animation:spin .8s linear infinite; margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg);}}
.center-col{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:24px 0;}
.timer-display{
  font-family:'Oswald',sans-serif; font-size:58px; font-weight:600; letter-spacing:2px;
  text-align:center; color:var(--ice2); text-shadow:0 0 22px rgba(111,214,255,.35); margin:18px 0 6px;
}
.photo-preview{width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-bottom:12px; border:1px solid var(--border);}
::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="app">
  <header class="topbar">
    <div class="brand">WINTER<span class="dot">.</span>ARC</div>
    <div class="brand-sub">DISIPLINË PËR 90 DITË</div>
    <div class="datebar">
      <button data-action="date-prev">‹</button>
      <div class="datelabel" id="dateLabel">—
        <span class="today-pill" id="todayPill"></span>
      </div>
      <button data-action="date-next">›</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="bottomnav" id="bottomnav">
    <button class="navbtn" data-tab="dashboard"><span class="ic">🏠</span><span class="lb">Ballina</span></button>
    <button class="navbtn" data-tab="food"><span class="ic">🍽️</span><span class="lb">Ushqimi</span></button>
    <button class="navbtn" data-tab="body"><span class="ic">💧</span><span class="lb">Trupi</span></button>
    <button class="navbtn" data-tab="discipline"><span class="ic">✅</span><span class="lb">Disiplina</span></button>
    <button class="navbtn" data-tab="tools"><span class="ic">🛠️</span><span class="lb">Mjetet</span></button>
  </nav>
</div>
<div id="modalRoot"></div>
<script>
/* ================= STORAGE HELPERS ================= */
async function sGet(key){
  try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key, val){
  try{ await window.storage.set(key, JSON.stringify(val), false); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ================= DATE HELPERS ================= */
const ALB_DAYS = ['Diel','Hënë','Martë','Mërkurë','Enjte','Premte','Shtunë'];
const ALB_MONTHS = ['Janar','Shkurt','Mars','Prill','Maj','Qershor','Korrik','Gusht','Shtator','Tetor','Nëntor','Dhjetor'];
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return fmtDate(new Date()); }
function dateFromStr(ds){ const [y,m,d]=ds.split('-').map(Number); return new Date(y,m-1,d); }
function displayDate(ds){
  const dt = dateFromStr(ds);
  return `${ALB_DAYS[dt.getDay()]}, ${dt.getDate()} ${ALB_MONTHS[dt.getMonth()]}`;
}
function shiftDate(ds, delta){
  const dt = dateFromStr(ds);
  dt.setDate(dt.getDate()+delta);
  return fmtDate(dt);
}

/* ================= GLOBAL STATE ================= */
let currentDate = todayStr();
let activeTab = 'dashboard';

/* ================= SNOWFALL BACKGROUND ================= */
(function snow(){
  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');
  let w,h,flakes;
  function size(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function init(){
    size();
    const count = Math.floor((w*h)/28000);
    flakes = Array.from({length: Math.max(18, Math.min(count,45))}, ()=>({
      x: Math.random()*w, y: Math.random()*h,
      r: Math.random()*2 + .6,
      s: Math.random()*.6 + .15,
      d: Math.random()*1 - .5
    }));
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = 'rgba(169,236,255,0.75)';
    for(const f of flakes){
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
      ctx.fill();
      f.y += f.s; f.x += f.d;
      if(f.y > h){ f.y = -4; f.x = Math.random()*w; }
      if(f.x > w) f.x = 0;
      if(f.x < 0) f.x = w;
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', size);
  init(); tick();
})();

/* ================= MODAL SYSTEM ================= */
function openModal(innerHtml, opts={}){
  const root = document.getElementById('modalRoot');
  const centered = opts.center ? 'center' : '';
  root.innerHTML = `
    <div class="modal-overlay ${centered}" data-action="modal-backdrop">
      <div class="modal" data-stop="1">
        <span class="modal-close" data-action="modal-close">✕</span>
        ${opts.title ? `<div class="modal-handle"></div><div class="modal-title">${opts.title}</div>` : '<div class="modal-handle"></div>'}
        ${innerHtml}
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
document.getElementById('modalRoot').addEventListener('click', (e)=>{
  if(e.target.dataset.action === 'modal-backdrop' || e.target.dataset.action === 'modal-close') closeModal();
});

/* ================= DATA MODEL ================= */
const DEFAULT_CONFIG = { habits: [], morningSteps: [], looksSteps: [], reminders: [], pornStart: null };
let _cfgCache = null;
async function getConfig(){
  let c = await sGet('config');
  let changed = false;
  if(!c){ c = JSON.parse(JSON.stringify(DEFAULT_CONFIG)); changed = true; }
  if(!c.habits) c.habits = [];
  if(!c.morningSteps) c.morningSteps = [];
  if(!c.looksSteps) c.looksSteps = [];
  if(!c.reminders) c.reminders = [];
  if(!c.pornStart){ c.pornStart = todayStr(); changed = true; }
  if(changed) await sSet('config', c);
  _cfgCache = c;
  return c;
}
async function saveConfig(c){ _cfgCache = c; await sSet('config', c); }

function defaultDay(){
  return {
    water: 0,
    sleep: { bed:'', wake:'', notes:'' },
    porn: { relapsed:false, note:'' },
    habitLog: {},
    morningLog: {},
    looksLog: {},
    workout: { sessions:[] }
  };
}
async function getDayRaw(ds){ return await sGet('day:'+ds); }
async function getDay(ds){
  const d = await getDayRaw(ds);
  const base = defaultDay();
  if(!d) return base;
  return {
    water: typeof d.water==='number' ? d.water : 0,
    sleep: { ...base.sleep, ...(d.sleep||{}) },
    porn: { ...base.porn, ...(d.porn||{}) },
    habitLog: d.habitLog || {},
    morningLog: d.morningLog || {},
    looksLog: d.looksLog || {},
    workout: { sessions: (d.workout && d.workout.sessions) || [] }
  };
}
async function saveDay(ds, obj){ await sSet('day:'+ds, obj); }

function defaultFood(){ return { breakfast:[], lunch:[], dinner:[], snack:[] }; }
async function getFood(ds){
  const f = await sGet('food:'+ds);
  const base = defaultFood();
  if(!f) return base;
  return { breakfast:f.breakfast||[], lunch:f.lunch||[], dinner:f.dinner||[], snack:f.snack||[] };
}
async function saveFood(ds, obj){ await sSet('food:'+ds, obj); }

async function getTodos(){ const t = await sGet('todos'); return t || []; }
async function saveTodos(t){ await sSet('todos', t); }

/* ---- streaks ---- */
async function pornStreak(cfg){
  let d = new Date();
  let count = 0;
  let guard = 0;
  while(guard < 3650){
    guard++;
    const ds = fmtDate(d);
    const day = await getDayRaw(ds);
    if(day && day.porn && day.porn.relapsed) break;
    count++;
    if(ds <= cfg.pornStart) break;
    d.setDate(d.getDate()-1);
  }
  return count;
}
async function doneStreak(checkFn){
  let d = new Date();
  let count = 0;
  let isToday = true;
  let guard = 0;
  while(guard < 3650){
    guard++;
    const ds = fmtDate(d);
    const day = await getDayRaw(ds);
    const ok = day && checkFn(day);
    if(!ok){
      if(isToday){ isToday=false; d.setDate(d.getDate()-1); continue; }
      break;
    }
    count++; isToday=false;
    d.setDate(d.getDate()-1);
  }
  return count;
}
function mealTotals(food){
  const all = [...food.breakfast, ...food.lunch, ...food.dinner, ...food.snack];
  return all.reduce((acc,i)=>{
    acc.cal += Number(i.calories)||0;
    acc.protein += Number(i.protein_g)||0;
    acc.carbs += Number(i.carbs_g)||0;
    acc.fat += Number(i.fat_g)||0;
    return acc;
  }, {cal:0, protein:0, carbs:0, fat:0});
}

/* ================= ROUTER ================= */
const TAB_RENDERERS = {}; // filled below by each module
function updateDateBar(){
  document.getElementById('dateLabel').innerHTML = displayDate(currentDate) + `<span class="today-pill" id="todayPill"></span>`;
  document.getElementById('todayPill').textContent = currentDate === todayStr() ? 'SOT' : currentDate;
}
async function renderTab(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===activeTab));
  updateDateBar();

/* ================= RING SVG HELPER ================= */
function ringSvg(pct, colorClass){
  const r = 40, c = 2*Math.PI*r;
  const off = c - (Math.min(Math.max(pct,0),1)) * c;
  return `<svg width="96" height="96" viewBox="0 0 96 96">
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="#1c2a3d" stroke-width="8"/>
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="url(#iceGrad)" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 48 48)"/>
    <defs><linearGradient id="iceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fd6ff"/><stop offset="100%" stop-color="#a9ecff"/>
    </linearGradient></defs>
  </svg>`;
}

const FOOD_PROMPT = `Analizo këtë foto ushqimi. Përgjigju VETËM me një objekt JSON të vlefshëm, pa markdown, pa shpjegime shtesë, saktësisht sipas kësaj skeme:
{"name": "emri i shkurtër i ushqimit në shqip", "calories": numër, "protein_g": numër, "carbs_g": numër, "fat_g": numër, "confidence": "high" ose "medium" ose "low"}
Vlerëso madhësinë e porcionit ashtu siç shfaqet realisht në foto. Nëse ka disa artikuj ushqimi, kombinoji të gjitha në një total të vlerësuar për të gjithë pjatën. Përgjigju vetëm me objektin JSON, asgjë tjetër.`;

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function analyzeFoodPhoto(file){
  const base64 = await fileToBase64(file);
  const mediaType = file.type || 'image/jpeg';
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      messages:[{
        role:'user',
        content:[
          {type:'image', source:{type:'base64', media_type:mediaType, data:base64}},
          {type:'text', text: FOOD_PROMPT}
        ]
      }]
    })
  });
  const data = await resp.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('no text');
  const clean = textBlock.text.replace(/```json|```/g,'').trim();
  return JSON.parse(clean);
}

function sleepDuration(bed, wake){
  const [bh,bm] = bed.split(':').map(Number);
  const [wh,wm] = wake.split(':').map(Number);
  let mins = (wh*60+wm) - (bh*60+bm);
  if(mins <= 0) mins += 24*60;
  const h = Math.floor(mins/60), m = mins%60;
  return `${h}orë ${m}min`;
}

        <div class="chip" data-action="timer-preset" data-sec="1500">25 min</div>
      </div>
      <div class="field-row" style="margin-top:12px;">
        <div class="field"><label>Minuta</label><input type="number" id="timerMin" value="0"></div>
        <div class="field"><label>Sekonda</label><input type="number" id="timerSec" value="30"></div>
      </div>
      <div class="timer-display" id="timerDisplay">00:30</div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary btn-block" data-action="timer-start">▶ Nis</button>
        <button class="btn btn-ghost" data-action="timer-pause">⏸</button>
        <button class="btn btn-ghost" data-action="timer-reset">↺</button>
      </div>
    </div>

    <div class="section-title">🔔 Kujtesat <span class="manage-link" data-action="reminder-add">+ Shto</span></div>
    <div class="card">
      ${cfg.reminders.length ? cfg.reminders.map(r=>`
        <div class="list-item">
          <div style="flex:1;"><div class="li-text">${escapeHtml(r.text)}</div><div class="li-sub">${r.time}</div></div>
          <span class="li-del" data-action="reminder-del" data-id="${r.id}">✕</span>
        </div>`).join('') : `<div class="empty-state">Shto një kujtesë me orë të caktuar. Vlen sa app-i qëndron i hapur në shfletues.</div>`}
    </div>
  `;
  return html;
};

/* --- timer engine --- */
let timerInterval = null;
let timerRemaining = 30;
function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  if(!el) return;
  const m = String(Math.floor(timerRemaining/60)).padStart(2,'0');
  const s = String(timerRemaining%60).padStart(2,'0');
  el.textContent = `${m}:${s}`;
}
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; o.type='sine';
    g.gain.setValueAtTime(.2, ctx.currentTime);
    o.start(); o.stop(ctx.currentTime + .35);
  }catch(e){}
}
function timerStart(){
  if(timerInterval) return;
  timerInterval = setInterval(()=>{
    timerRemaining--;
    if(timerRemaining <= 0){
      timerRemaining = 0;
      updateTimerDisplay();
      clearInterval(timerInterval); timerInterval=null;
      beep();
      return;
    }
    updateTimerDisplay();
  },1000);
}
function timerPause(){ clearInterval(timerInterval); timerInterval=null; }
function timerReset(){
  timerPause();
  const min = Number(document.getElementById('timerMin')?.value||0);
  const sec = Number(document.getElementById('timerSec')?.value||30);
  timerRemaining = min*60+sec;
  updateTimerDisplay();
}
function reminderAddModal(){
  openModal(`
    <div class="field"><label>Teksti</label><input type="text" id="remText" placeholder="p.sh. Merr vitaminat"></div>
    <div class="field"><label>Ora</label><input type="time" id="remTime" value="08:00"></div>
    <button class="btn btn-primary btn-block" id="remSave">Ruaj Kujtesën</button>
  `, {title:'Kujtesë e Re', center:true});
  document.getElementById('remSave').addEventListener('click', async ()=>{
    const text = document.getElementById('remText').value.trim();
    const time = document.getElementById('remTime').value;
    if(!text || !time) return;
    const c = await getConfig();
    c.reminders.push({id:uid(), text, time, firedOn:''});
    await saveConfig(c);
    closeModal();
    renderTab();
    if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
  });
}
setInterval(async ()=>{
  if(!_cfgCache || !_cfgCache.reminders || !_cfgCache.reminders.length) return;
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const today = todayStr();
  let changed = false;
  for(const r of _cfgCache.reminders){
    if(r.time === hhmm && r.firedOn !== today){
      r.firedOn = today;
      changed = true;
      if('Notification' in window && Notification.permission==='granted'){
        new Notification('WINTER ARC', {body:r.text});
      } else {
        beep();
      }
    }
  }
  if(changed) await saveConfig(_cfgCache);
},20000);

/* ================= CENTRAL EVENT DELEGATION ================= */
document.getElementById('view').addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const ds = currentDate;

  if(action==='water-plus'){
    const day = await getDay(ds); day.water++; await saveDay(ds, day); renderTab(); return;
  }
  if(action==='water-minus'){
    const day = await getDay(ds); day.water = Math.max(0, day.water-1); await saveDay(ds, day); renderTab(); return;
  }
  if(action==='water-set'){
    const day = await getDay(ds); day.water = Number(btn.dataset.n); await saveDay(ds, day); renderTab(); return;
  }
  if(action==='sleep-save'){
    const day = await getDay(ds);
    day.sleep.bed = document.getElementById('sleepBed').value;
    day.sleep.wake = document.getElementById('sleepWake').value;
    day.sleep.notes = document.getElementById('sleepNotes').value;
    await saveDay(ds, day); renderTab(); return;
  }
  if(action==='workout-add'){
    const activeChip = document.querySelector('#workoutTypeChips .chip.on');
    const type = activeChip ? activeChip.dataset.type : WORKOUT_TYPES[0];
    const duration = document.getElementById('woDuration').value;
    const notes = document.getElementById('woNotes').value;
    const day = await getDay(ds);
    day.workout.sessions.push({id:uid(), type, duration, notes});
    await saveDay(ds, day); renderTab(); return;
  }
  if(action==='workout-del'){
    const day = await getDay(ds);
    day.workout.sessions = day.workout.sessions.filter(s=>s.id!==btn.dataset.id);
    await saveDay(ds, day); renderTab(); return;
  }
  if(action==='looks-toggle'){
    const day = await getDay(ds); day.looksLog[btn.dataset.id] = !day.looksLog[btn.dataset.id];
    await saveDay(ds, day); renderTab(); return;
  }
  if(action==='manage-looks'){ const c=await getConfig(); manageListModal('Hapat e Looksmaxing', 'looksSteps', c, 'p.sh. Skincare AM'); return; }
  if(action==='manage-habits'){ const c=await getConfig(); manageListModal('Zakonet e Tua', 'habits', c, 'p.sh. Lexo 10 faqe'); return; }
  if(action==='manage-morning'){ const c=await getConfig(); manageListModal('Rutina e Mëngjesit', 'morningSteps', c, 'p.sh. Bëj shtratin'); return; }
  if(action==='habit-toggle'){
    const day = await getDay(ds); day.habitLog[btn.dataset.id] = !day.habitLog[btn.dataset.id];
    await saveDay(ds, day); renderTab(); return;
  }
  if(action==='morning-toggle'){
    const day = await getDay(ds); day.morningLog[btn.dataset.id] = !day.morningLog[btn.dataset.id];
    await saveDay(ds, day); renderTab(); return;
  }
  if(action==='relapse-mark'){ relapseModal(); return; }
  if(action==='todo-add'){
    const input = document.getElementById('newTodoInput');
    const val = input.value.trim();
    if(!val) return;
    const todos = await getTodos();
    todos.push({id:uid(), text:val, done:false});
    await saveTodos(todos); renderTab(); return;
  }
  if(action==='todo-toggle'){
    const todos = await getTodos();
    const t = todos.find(x=>x.id===btn.dataset.id);
    if(t) t.done = !t.done;
    await saveTodos(todos); renderTab(); return;
  }
  if(action==='todo-del'){
    let todos = await getTodos();
    todos = todos.filter(x=>x.id!==btn.dataset.id);
    await saveTodos(todos); renderTab(); return;
  }
  if(action==='food-add-generic'){ mealPickerModal((meal)=>foodAddModal(meal)); return; }
  if(action==='food-add'){ foodAddModal(btn.dataset.meal); return; }
  if(action==='food-manual'){
    const zone = document.getElementById('foodAnalyzeZone');
    zone.innerHTML='';
    renderFoodResultForm(zone, btn.dataset.meal, {name:'', calories:0, protein_g:0, carbs_g:0, fat_g:0});
    return;
  }
  if(action==='food-del'){
    const food = await getFood(ds);
    food[btn.dataset.meal] = food[btn.dataset.meal].filter(i=>i.id!==btn.dataset.id);
    await saveFood(ds, food); renderTab(); return;
  }
  if(action==='timer-start'){ timerStart(); return; }
  if(action==='timer-pause'){ timerPause(); return; }
  if(action==='timer-reset'){ timerReset(); return; }
  if(action==='timer-preset'){
    timerPause();
    timerRemaining = Number(btn.dataset.sec);
    const mEl = document.getElementById('timerMin'), sEl = document.getElementById('timerSec');
    if(mEl) mEl.value = Math.floor(timerRemaining/60);
    if(sEl) sEl.value = timerRemaining%60;
    updateTimerDisplay(); return;
  }
  if(action==='reminder-add'){ reminderAddModal(); return; }
  if(action==='reminder-del'){
    const c = await getConfig();
    c.reminders = c.reminders.filter(r=>r.id!==btn.dataset.id);
    await saveConfig(c); renderTab(); return;
  }
});

document.getElementById('view').addEventListener('change', (e)=>{
  if((e.target.id==='timerMin' || e.target.id==='timerSec') && !timerInterval){
    timerReset();
  }
});

/* workout type chip selection (delegated, toggles single-select) */
document.getElementById('view').addEventListener('click', (e)=>{
  const chip = e.target.closest('#workoutTypeChips .chip');
  if(!chip) return;
  document.querySelectorAll('#workoutTypeChips .chip').forEach(c=>c.classList.remove('on'));
  chip.classList.add('on');
});

/* input changes that should persist immediately (todo enter key) */
document.getElementById('view').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && e.target.id==='newTodoInput'){
    e.preventDefault();
    document.querySelector('[data-action="todo-add"]')?.click();
  }
});

/* ================= INIT ================= */
(async function init(){
  await getConfig();
  updateTimerDisplay();
  await renderTab();
})();

/* ================= PWA INSTALL SUPPORT ================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
